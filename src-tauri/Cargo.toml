[package]
name = "gugu-gallery"
version = "0.6.3"
edition = "2021"
description = "咕咕图库 · GuguGallery"
authors = ["LiCo16zy"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
