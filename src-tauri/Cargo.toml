[package]
name = "gugu-gallery"
version = "0.6.3"
edition = "2021"
description = "咕咕图库 · GuguGallery"
authors = ["LiCo16zy"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "charset", "http2", "default-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["clock"] }
urlencoding = "2"
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
